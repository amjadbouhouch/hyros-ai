[package]
name = "hyros-ai-desktop"
version = "0.0.0"
description = "Hyros AI desktop application"
edition = "2021"

[lib]
name = "hyros_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# keyring v3 ships NO default backends: without an explicit store feature it
# silently falls back to an in-memory mock (writes "succeed", reads find
# nothing). apple-native = real macOS Keychain; windows-native / sync-secret-
# service keep the same behavior on Windows/Linux prod builds.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
open = "5"
